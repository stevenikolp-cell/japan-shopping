<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>일본 쇼핑 리스트</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <header class="main-header">

        <h1>
            🇯🇵 일본 쇼핑 리스트
        </h1>

        <p class="header-description">
            사고 싶은 상품을 선택하고 일본에서 구매 완료를 체크하세요.
        </p>


        <div class="summary-box">

            <div class="summary-item">

                <span>
                    선택 상품
                </span>

                <strong>
                    <span id="selectedCount">0</span>개
                </strong>

            </div>


            <div class="summary-item">

                <span>
                    구매 완료
                </span>

                <strong>
                    <span id="completedCount">0</span>
                    /
                    <span id="totalCount">0</span>
                </strong>

            </div>


            <div class="summary-item">

                <span>
                    총 구매 수량
                </span>

                <strong>
                    <span id="totalQuantity">0</span>개
                </strong>

            </div>

        </div>

    </header>


    <main>

        <section class="section info-notice">

            <p>
                ⭐ 화장품 평점은 @cosme 7점 만점 기준이며
                확인 시점 이후 변경될 수 있습니다.
            </p>

            <p>
                💊 의약품 정보는 일본 제품의 공식 효능·용법을
                쇼핑 확인용으로 요약한 것입니다.
                실제 복용·사용 전 포장과 첨부문서를 확인하세요.
            </p>

        </section>


        <section class="section filter-section">

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="상품명, 성분, 효능, 일본어 검색"
                    autocomplete="off"
                >

            </div>


            <div class="filter-block">

                <h3>
                    카테고리
                </h3>

                <div
                    id="categoryFilters"
                    class="filter-buttons"
                >
                </div>

            </div>


            <div class="filter-block">

                <h3>
                    구매처
                </h3>

                <div
                    id="storeFilters"
                    class="filter-buttons"
                >
                </div>

            </div>

        </section>


        <section class="section">

            <div class="section-title-row">

                <h2>
                    상품 목록
                </h2>

                <span id="productResultCount">
                    0개
                </span>

            </div>


            <p
                id="noProductMessage"
                class="empty-message"
            >
                조건에 맞는 상품이 없습니다.
            </p>


            <div
                id="productList"
                class="product-list"
            >
            </div>

        </section>


        <section class="section">

            <div class="section-title-row">

                <h2>
                    🛒 내 쇼핑리스트
                </h2>

            </div>


            <p
                id="emptyMessage"
                class="empty-message"
            >
                아직 선택한 상품이 없습니다.
            </p>


            <div
                id="shoppingList"
                class="shopping-list"
            >
            </div>

        </section>

    </main>


    <script src="products.js"></script>
    <script src="app.js"></script>

</body>

</html>
